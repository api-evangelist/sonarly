aid: sonarly
name: Sonarly
description: >-
  Sonarly is an AI production-reliability platform (Y Combinator W2026, Paris)
  that turns noisy production alerts into clear, deduplicated bug reports and
  ships ready-to-merge fix pull requests. It connects to a team's code
  (GitHub/GitLab) and their error and observability stack — Sentry, Datadog,
  Grafana, New Relic, SigNoz, CloudWatch, GCP, and many more — then triages
  every alert to remove noise and duplicates, investigates logs, traces and
  metrics to find the root cause, and generates a fix PR or alerting-rule
  recommendation. Sonarly exposes a read-only public REST API (v1) for pulling
  bugs, incidents and analysis runs into custom dashboards, signed outbound
  webhooks for live events, and a device-code style setup-session API that lets
  a coding agent (Claude Code, Cursor) onboard a tenant end-to-end. Onboarding
  is fully agent-native and documented at sonarly.com/llms.txt.
